app = "jung-archive"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Persistent volume for Chroma/BM25 if you need write-on-boot persistence.
# Create with: fly volumes create jung_data --region iad --size 2
# Then uncomment:
# [[mounts]]
#   source = "jung_data"
#   destination = "/app/data"

[env]
  GENERATION_PROVIDER = "openai_compatible"
  GENERATION_BASE_URL = "https://integrate.api.nvidia.com/v1"
  GENERATION_MODEL = "meta/llama-3.2-11b-vision-instruct"
  GENERATION_TIMEOUT = "60"

[deploy]
  release_command = "python -c 'import sys; print(sys.version)'"
